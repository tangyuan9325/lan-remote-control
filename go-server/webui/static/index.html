<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAN Remote Control - Web 控制台</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: #0f1115; color: #e6e8ee; min-height: 100vh;
}
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px; background: #161a22; border-bottom: 1px solid #232a36;
}
header h1 { font-size: 16px; font-weight: 600; }
#status { font-size: 13px; color: #9aa4b2; }
#status.on { color: #4ade80; }
main { display: flex; gap: 16px; padding: 16px; flex-wrap: wrap; }
.panel {
  background: #161a22; border: 1px solid #232a36; border-radius: 10px;
  padding: 14px;
}
#screenPanel { flex: 1 1 640px; min-width: 320px; }
#sidePanel { flex: 0 1 360px; min-width: 300px; display: flex; flex-direction: column; gap: 14px; }
label { font-size: 13px; color: #9aa4b2; display: block; margin-bottom: 4px; }
input[type=text], input[type=password] {
  width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #2c3442;
  background: #0f1115; color: #e6e8ee; font-size: 14px;
}
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button {
  padding: 8px 14px; border-radius: 6px; border: 1px solid #2c3442;
  background: #223046; color: #dbeafe; cursor: pointer; font-size: 13px;
}
button:hover { background: #2b3d59; }
button.danger { background: #4b2430; color: #fecdd3; }
#screenWrap { position: relative; background: #000; border-radius: 8px; overflow: hidden; margin-top: 10px; }
#screen { width: 100%; display: block; user-select: none; -webkit-user-select: none; touch-action: none; }
#overlayMsg {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: #9aa4b2; font-size: 14px; background: rgba(10,12,16,.7);
}
.hidden { display: none !important; }
#log {
  height: 140px; overflow-y: auto; background: #0f1115; border: 1px solid #232a36;
  border-radius: 6px; padding: 8px; font-family: Consolas, monospace; font-size: 12px;
  white-space: pre-wrap; word-break: break-all;
}
.logline { color: #9aa4b2; }
.logline.err { color: #f87171; }
.logline.ok { color: #4ade80; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#devInfo { font-size: 13px; color: #9aa4b2; line-height: 1.7; white-space: pre-wrap; }
#fps { font-size: 12px; color: #6b7280; }
.scanList { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow-y: auto; }
.devItem {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
  background: #0f1115; border: 1px solid #232a36; border-radius: 6px; padding: 8px 10px;
}
.devItem .name { font-size: 13px; color: #e6e8ee; }
.devItem .addr { font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<header>
  <h1>🖥️ LAN Remote Control · Web 控制台</h1>
  <div><span id="fps"></span> &nbsp; <span id="status">未连接</span></div>
</header>
<main>
  <section class="panel" id="screenPanel">
    <label>远程屏幕（点击画面后用键盘输入）</label>
    <div id="screenWrap">
      <img id="screen" alt="" draggable="false">
      <div id="overlayMsg">尚未连接</div>
    </div>
    <div class="row">
      <button id="btnCam">摄像头监视</button>
      <button id="btnStopCam" class="danger hidden">停止摄像头</button>
      <button id="btnDisconnect" class="danger hidden">断开连接</button>
    </div>
  </section>

  <section class="panel" id="sidePanel">
    <div>
      <label>设备地址（host[:port]，默认控制端口 9001；留空=本机）</label>
      <input type="text" id="hostInput" placeholder="例如 192.168.1.20 或留空">
      <label style="margin-top:8px">访问密码（服务端未设密码可留空）</label>
      <input type="password" id="passInput" placeholder="密码">
      <div class="row">
        <button id="btnConnect">连接</button>
        <button id="btnScan">扫描局域网设备</button>
      </div>
      <div class="scanList" id="scanList"></div>
    </div>

    <div>
      <label>设备信息</label>
      <div id="devInfo">-</div>
    </div>

    <div>
      <label>画质（10-100）</label>
      <div class="grid2">
        <input type="text" id="qualityInput" value="50">
        <button id="btnQuality">应用</button>
      </div>
    </div>

    <div>
      <label>快捷按键</label>
      <div class="row">
        <button data-key="Escape">Esc</button>
        <button data-key="Enter">Enter</button>
        <button data-combo="ctrl,c">Ctrl+C</button>
        <button data-combo="ctrl,v">Ctrl+V</button>
        <button data-combo="alt,Tab">Alt+Tab</button>
      </div>
    </div>

    <div>
      <label>日志</label>
      <div id="log"></div>
    </div>
  </section>
</main>

<script>
"use strict";
/* 安全约定：所有写入 DOM 的外部数据一律走 textContent，禁止 innerHTML 拼接（防 XSS）。 */
const $ = (id) => document.getElementById(id);
const statusEl = $("status"), screenEl = $("screen"), overlayEl = $("overlayMsg");
let ws = null, camWs = null;
let frameCount = 0, lastFpsT = performance.now();

function log(msg, cls) {
  const el = document.createElement("div");
  el.className = "logline" + (cls ? " " + cls : "");
  el.textContent = new Date().toLocaleTimeString() + "  " + msg;
  const box = $("log");
  box.appendChild(el);
  while (box.children.length > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function setStatus(text, on) {
  statusEl.textContent = text;
  statusEl.className = on ? "on" : "";
}
function setOverlay(text) {
  overlayEl.textContent = text;
  overlayEl.classList.toggle("hidden", !text);
}
function str(s) { return typeof s === "string" ? s : (typeof s === "number" ? String(s) : "-"); }
function isLocalTarget(host) {
  const h = host.split(":")[0]; // 去掉端口部分
  return h === "" || h === "localhost" || h.startsWith("127.") || h === "::1";
}

/* ---------- WebSocket 连接（携带密码：后端 /ws 会校验 ?password=） ---------- */
function connect() {
  if (ws) disconnect();
  const host = $("hostInput").value.trim();
  const pass = $("passInput").value;
  const qs = new URLSearchParams();
  if (host) {
    qs.set("target", host);
    // 代理模式：远端被控机的密码通过 remote_password 传给后端，由后端在
    // TCP hello 握手中转发（/ws 的 password 参数只校验本机服务端）。
    qs.set("remote_password", pass || "");
  }
  qs.set("password", pass || "");
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = proto + "//" + location.host + "/ws?" + qs.toString();
  setStatus("连接中…", false);
  setOverlay("连接中…");
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { log("WebSocket 已连接，等待握手…", "ok"); startHeartbeat(); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string") { handleJson(ev.data); return; }
    const blob = new Blob([ev.data], { type: "image/jpeg" });
    const old = screenEl.src;
    screenEl.src = URL.createObjectURL(blob);
    if (old) URL.revokeObjectURL(old);
    frameCount++;
    const now = performance.now();
    if (now - lastFpsT >= 1000) {
      $("fps").textContent = Math.round(frameCount * 1000 / (now - lastFpsT)) + " fps";
      frameCount = 0; lastFpsT = now;
    }
  };
  ws.onerror = () => log("WebSocket 错误", "err");
  ws.onclose = (ev) => {
    stopHeartbeat();
    setStatus("已断开", false);
    setOverlay("连接已断开");
    $("btnDisconnect").classList.add("hidden");
    stopCamera();
    ws = null;
    if (ev.reason) log("关闭原因: " + ev.reason, "err");
  };
}

/* ---------- 心跳：30s ping/pong，维持服务端读空闲计时器 ---------- */
let hbTimer = null;
function startHeartbeat() {
  stopHeartbeat();
  hbTimer = setInterval(() => send({ type: "ping" }), 30000);
}
function stopHeartbeat() {
  if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
}

function handleJson(raw) {
  let m;
  try { m = JSON.parse(raw); } catch (e) { log("坏消息: " + raw.slice(0, 120), "err"); return; }
  switch (m.type) {
    case "hello_ok":
      setStatus("已连接", true);
      setOverlay("");
      $("btnDisconnect").classList.remove("hidden");
      $("devInfo").textContent =
        "主机: " + str(m.name) + "\n系统: " + str(m.os) +
        "\n分辨率: " + str(m.width) + "x" + str(m.height) +
        "\n协议: v" + str(m.version);
      log("握手成功 " + str(m.width) + "x" + str(m.height), "ok");
      break;
    case "hello_fail":
      setOverlay("远端密码错误");
      log("远端握手被拒绝: " + str(m.message || "bad password"), "err");
      break;
    case "error":
      log("服务端错误: " + str(m.message), "err");
      break;
    case "pong":
      break;
    default:
      log("消息: " + str(m.type));
  }
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}
function disconnect() {
  if (camWs) stopCamera();
  if (ws) { try { ws.close(1000, "client quit"); } catch (e) {} ws = null; }
  setStatus("未连接", false);
  setOverlay("尚未连接");
  $("btnDisconnect").classList.add("hidden");
}

/* ---------- 鼠标事件：归一化坐标 0..1（与 docs/protocol.md 一致） ---------- */
function normPos(ev) {
  const r = screenEl.getBoundingClientRect();
  const x = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  const y = Math.min(1, Math.max(0, (ev.clientY - r.top) / r.height));
  return { x, y };
}
let lastMoveT = 0;
screenEl.addEventListener("pointermove", (ev) => {
  const now = performance.now();
  if (now - lastMoveT < 33) return; // ~30Hz 节流
  lastMoveT = now;
  const p = normPos(ev);
  send({ type: "mouse_move", x: p.x, y: p.y });
});
screenEl.addEventListener("pointerdown", (ev) => {
  try { screenEl.setPointerCapture(ev.pointerId); } catch (e) {}
  const p = normPos(ev);
  send({ type: "mouse_down", x: p.x, y: p.y, button: btnName(ev.button) });
});
screenEl.addEventListener("pointerup", (ev) => {
  const p = normPos(ev);
  send({ type: "mouse_up", x: p.x, y: p.y, button: btnName(ev.button) });
});
screenEl.addEventListener("dblclick", (ev) => {
  const p = normPos(ev);
  send({ type: "mouse_double", x: p.x, y: p.y, button: "left" });
});
screenEl.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  send({ type: "mouse_scroll", dx: 0, dy: Math.sign(ev.deltaY) * 3 });
}, { passive: false });
function btnName(b) { return b === 2 ? "right" : b === 1 ? "middle" : "left"; }

/* ---------- 键盘事件 ---------- */
document.addEventListener("keydown", (ev) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (isTypingInForm(ev.target)) return;
  ev.preventDefault();
  send({ type: "key_down", key: mapKey(ev.key), ctrl: ev.ctrlKey, alt: ev.altKey, shift: ev.shiftKey, meta: ev.metaKey });
});
document.addEventListener("keyup", (ev) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (isTypingInForm(ev.target)) return;
  ev.preventDefault();
  send({ type: "key_up", key: mapKey(ev.key) });
});
document.addEventListener("keypress", (ev) => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  if (isTypingInForm(ev.target)) return;
  if (ev.ctrlKey || ev.altKey || ev.metaKey) return;
  if (ev.key && ev.key.length === 1) send({ type: "type", text: ev.key });
});
function isTypingInForm(t) { return t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA"); }
function mapKey(k) { return k.length === 1 ? k.toLowerCase() : k; }

/* ---------- 快捷按钮 ---------- */
$("btnConnect").addEventListener("click", connect);
$("btnDisconnect").addEventListener("click", disconnect);
$("btnQuality").addEventListener("click", () => {
  let q = parseInt($("qualityInput").value, 10);
  if (isNaN(q)) q = 50;
  q = Math.min(100, Math.max(10, q));
  $("qualityInput").value = String(q);
  send({ type: "set_quality", quality: q });
  log("设置画质 " + q);
});
document.querySelectorAll("[data-key]").forEach((b) => {
  b.addEventListener("click", () => {
    const k = b.getAttribute("data-key");
    send({ type: "key_down", key: k });
    send({ type: "key_up", key: k });
  });
});
document.querySelectorAll("[data-combo]").forEach((b) => {
  b.addEventListener("click", () => {
    const parts = b.getAttribute("data-combo").split(",");
    const mod = parts[0], key = parts[1];
    const obj = { type: "key_down", key };
    if (mod.includes("ctrl")) obj.ctrl = true;
    if (mod.includes("alt")) obj.alt = true;
    if (mod.includes("shift")) obj.shift = true;
    send(obj);
    send({ type: "key_up", key });
  });
});

/* ---------- 局域网扫描（调用本机服务端的 UDP 发现接口） ---------- */
$("btnScan").addEventListener("click", async () => {
  const list = $("scanList");
  list.textContent = "";
  log("正在扫描 UDP:9000 …");
  try {
    const resp = await fetch("/api/devices");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const devs = await resp.json();
    if (!Array.isArray(devs) || devs.length === 0) { log("未发现设备"); return; }
    devs.forEach((d) => {
      const item = document.createElement("div");
      item.className = "devItem";
      const left = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = str(d.hostname || d.name) + (d.needs_password ? " 🔒" : "");
      const addr = document.createElement("div");
      addr.className = "addr";
      addr.textContent = str(d.ip) + ":" + str(d.port) + "  (" + str(d.os) + ")";
      left.appendChild(name);
      left.appendChild(addr);
      const btn = document.createElement("button");
      btn.textContent = "连接";
      btn.addEventListener("click", () => {
        $("hostInput").value = str(d.ip) + ":" + str(d.port);
        connect();
      });
      item.appendChild(left);
      item.appendChild(btn);
      list.appendChild(item);
    });
    log("发现 " + devs.length + " 台设备", "ok");
  } catch (e) {
    log("扫描失败: " + e.message, "err");
  }
});

/* ---------- 摄像头（同样需要密码） ---------- */
$("btnCam").addEventListener("click", () => {
  if (camWs) return;
  const pass = $("passInput").value || "";
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  camWs = new WebSocket(proto + "//" + location.host + "/camera?password=" + encodeURIComponent(pass));
  camWs.binaryType = "arraybuffer";
  camWs.onmessage = (ev) => {
    if (typeof ev.data !== "string") {
      const blob = new Blob([ev.data], { type: "image/jpeg" });
      const old = screenEl.src;
      screenEl.src = URL.createObjectURL(blob);
      if (old) URL.revokeObjectURL(old);
    }
  };
  camWs.onclose = () => {
    camWs = null;
    $("btnStopCam").classList.add("hidden");
    $("btnCam").classList.remove("hidden");
  };
  $("btnCam").classList.add("hidden");
  $("btnStopCam").classList.remove("hidden");
  log("摄像头已开启", "ok");
});
$("btnStopCam").addEventListener("click", stopCamera);
function stopCamera() {
  if (camWs) { try { camWs.close(); } catch (e) {} camWs = null; }
  $("btnStopCam").classList.add("hidden");
  $("btnCam").classList.remove("hidden");
}

$("passInput").addEventListener("keydown", (ev) => { if (ev.key === "Enter") connect(); });
</script>
</body>
</html>
