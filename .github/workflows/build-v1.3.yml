name: Build v1.3.0

on:
  push:
    branches: [main]
    paths:
      - 'go-server/**'
      - '.github/workflows/build-v1.3.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: |
          cd go-server
          go build -v -ldflags "-s -w" -o ..\build\lan-remote-control-v1.3.0-windows-server.exe .\cmd\server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/*.exe

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-exe
          path: dist/
      - name: List files
        run: ls -la dist/ 2>/dev/null || echo "No artifacts found"
      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: LAN Remote Control v1.3.0
          files: |
            dist/*
          body: |
            ## LAN Remote Control v1.3.0

            ### Major Updates
            - **Go Engine**: Rewritten server in Go for high performance
            - **Web Control**: Browser-based control at http://IP:8080
            - **Camera**: Remote camera viewing
            - **New UI**: Dark theme + Liquid Glass glassmorphism

            ### Source Code
            Full source code is available in the repository.

            ### Usage
            1. Build and run `go-server/cmd/server` on Windows
            2. Open browser at http://PC_IP:8080 for web control
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
