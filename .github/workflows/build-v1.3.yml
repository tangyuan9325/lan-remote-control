name: Build v1.3.0

on:
  push:
    branches: [main]
    paths:
      - 'go-server/**'
      - 'android/**'
      - '.github/workflows/build-v1.3.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Go mod tidy
        run: |
          cd go-server
          go mod tidy
      - name: Go vet
        run: |
          cd go-server
          go vet ./...
      - name: Build Go server
        run: |
          cd go-server
          mkdir -p ../build
          go build -ldflags "-s -w" -o ../build/lan-remote-control-v1.3.0-windows-server.exe ./cmd/server
      - name: Verify build
        run: |
          dir build\
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/*.exe

  build-android:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Build controller APK
        run: |
          cd android/remote_control_app
          flutter pub get
          flutter build apk --release --no-shrink
          mkdir -p ../../build
          cp build/app/outputs/flutter-apk/app-release.apk ../../build/lan-remote-control-v1.3.0-android-controller.apk
      - name: Build server APK
        run: |
          cd android/remote_control_server
          flutter pub get
          flutter build apk --release --no-shrink
          mkdir -p ../../build
          cp build/app/outputs/flutter-apk/app-release.apk ../../build/lan-remote-control-v1.3.0-android-server.apk
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/*.apk

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist/
      - name: Download Android artifacts (if available)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: dist/
      - name: List files
        run: ls -la dist/
      - name: Create Release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: LAN Remote Control v1.3.0
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/*.apk
          body: |
            ## LAN Remote Control v1.3.0

            ### Major Updates
            - **Go Engine**: Rewritten server in Go for high performance and low latency
            - **GPU Capture**: DXGI Desktop Duplication API (GDI fallback)
            - **Web Control**: Browser-based control at http://IP:8080
            - **Camera**: Remote camera viewing
            - **New UI**: Dark theme + Liquid Glass glassmorphism
            - **Silent Start**: Background operation

            ### Downloads
            | File | Description |
            |------|-------------|
            | `lan-remote-control-v1.3.0-windows-server.exe` | Windows controlled side (Go engine) |
            | `lan-remote-control-v1.3.0-android-controller.apk` | Android controller |
            | `lan-remote-control-v1.3.0-android-server.apk` | Android controlled side |

            ### Usage
            1. Run `windows-server.exe` on the PC to control
            2. Open browser at http://PC_IP:8080 for web control
            3. Or install Android controller APK for mobile control
            4. Ensure devices are on the same LAN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
