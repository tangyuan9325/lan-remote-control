name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
  push:
    branches:
      - main
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build Server (controlled side)
        run: |
          cd windows/server
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --name RemoteControl-Server --clean main.py

      - name: Build Viewer (PyQt5 WebView)
        run: |
          cd windows/viewer_pyqt
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --windowed --name RemoteControl-Viewer --clean --add-data "web;web" main.py

      - name: Package artifacts
        run: |
          if (!(Test-Path build)) { New-Item -ItemType Directory -Path build }
          Copy-Item "windows\server\dist\RemoteControl-Server.exe" "build\lan-remote-control-v1.2.0-windows-server.exe" -Force
          Copy-Item "windows\viewer_pyqt\dist\RemoteControl-Viewer.exe" "build\lan-remote-control-v1.2.0-windows-viewer.exe" -Force
          dir build\

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: build/*.exe
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download EXE artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-executables
          path: dist/

      - name: Verify files
        run: |
          ls -la dist/

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: LAN Remote Control v1.2.0
          draft: false
          prerelease: false
          files: |
            dist/*.exe
          body: |
            ## LAN Remote Control v1.2.0

            ### Windows Client
            - `lan-remote-control-v1.2.0-windows-server.exe` — 被控端（运行在被控制的电脑上）
            - `lan-remote-control-v1.2.0-windows-viewer.exe` — 控制端（PyQt5 WebView界面）

            ### Features
            - 屏幕实时传输
            - 鼠标键盘远程控制
            - 文件传输
            - 语音通话
            - 内网自动发现

            ### Usage
            1. 在被控制的Windows电脑上运行 server.exe
            2. 在控制端运行 viewer.exe 或安装Android APK
            3. 确保设备在同一局域网内
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
