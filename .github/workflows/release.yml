name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
      build_go_v13:
        description: 'Build go-server v1.3 engine (windows exe)'
        type: boolean
        default: true
      build_legacy_v2:
        description: 'Build legacy-v2 Go server (windows exe)'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.2.0" >> $GITHUB_OUTPUT
          fi

      - name: Create tag if needed
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG"
            git push origin "$TAG" || echo "Tag push may fail (already exists or permission)"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Build APK (controller)
        run: |
          cd android/remote_control_app
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../lan-remote-control-android.apk

      - name: Build APK (server)
        run: |
          cd android/remote_control_server
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../../lan-remote-control-android-server.apk

      # NOTE: PyInstaller cannot cross-compile — a Linux runner produces ELF
      # binaries, not Windows .exe. The Python fixed build (legacy rc14 /
      # windows-server) is therefore built by the dedicated windows-build.yml
      # workflow on a real Windows runner; here we only ship Go + Flutter
      # artifacts (Go supports GOOS=windows cross-compilation natively).

      - name: Set up Go
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_go_v13 != 'false' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build go-server v1.3 engine (Windows exe)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_go_v13 != 'false' }}
        run: |
          cd go-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../lan-remote-control-server-v1.3.0-windows-amd64.exe ./cmd/server

      - name: Build legacy-v2 Go server (Windows exe)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_legacy_v2 != 'false' }}
        run: |
          cd legacy-v2
          go mod tidy
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../remote-control-v2.0.0-windows-amd64.exe ./cmd/server

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## LAN Remote Control ${{ steps.version.outputs.tag }}

            ### 构件清单 (Assets)
            - `lan-remote-control-android.apk` — Android 控制端 APK（Flutter，含文件管理/语音）
            - `lan-remote-control-android-server.apk` — Android 被控端 APK（密码强制、连接数限制、会话看门狗）
            - `lan-remote-control-server-v1.3.0-windows-amd64.exe` — **Go 语言重构版**被控端引擎 v1.3.0（TCP 9001 + Web 8080，恒定时间密码校验、WebSocket 鉴权、SSRF 防护、输入注入、摄像头转发）
            - `remote-control-v2.0.0-windows-amd64.exe` — **legacy v2.0 Go 重写版**（Claude 风格 Web UI、按需采集帧差去重、MJPEG 并发上限、rc_token Cookie 鉴权、路径安全）
            - legacy v1.4.1 Python 修复版源码位于 `legacy/remote_control/rc14/`（`python -m rc14.main` 运行；Windows exe 请通过 windows-build.yml 在 Windows runner 上构建——PyInstaller 不支持交叉编译）

            ### 安全与功能要点
            - 密码比较使用 crypto/subtle 恒定时间，杜绝时序侧信道
            - /ws、/camera、video_feed 全部强制鉴权；UDP 发现限速；连接数 DoS 上限
            - 文件传输：路径穿越拦截、危险字符过滤、1GB 大小限制
            - 静态资源 go:embed 内嵌，PyInstaller spec 修复打包问题

            ### Usage
            1. 在被控机运行任一 server exe（推荐 v1.3.0 Go 版），设置 `--password`
            2. 浏览器打开 `http://被控机IP:8080` 或安装 APK / 运行 v2.0 Web UI
            3. 同局域网设备经 UDP:9000 自动发现
          files: |
            lan-remote-control-android.apk
            lan-remote-control-android-server.apk
            lan-remote-control-server-v1.3.0-windows-amd64.exe
            remote-control-v2.0.0-windows-amd64.exe
          draft: false
          prerelease: false
